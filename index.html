          <div class="welcome-feature-item">💾 Simpan ke Galeri</div>

        </div>

          class="btn welcome-btn"
          aria-label="Mulai menggunakan QR Generator"

          atau tunggu <span id="welcome-countdown">5</span> detik
        </p>
      </div>

    <!-- Main App -->
    <div id="app-wrapper" class="app-wrapper app-hidden">
      <main class="container" role="main">
        <!-- Hero Section -->
        <div class="hero">
          <div class="hero-badge">✦ QR Generator</div>
          <h1 class="title">
            Turn any link into<br />a <span class="title-accent">QR Code</span>
          </h1>
          <p class="subtitle">Paste your URL below and generate instantly</p>
        </div>

        <!-- Input Card -->
        <div class="input-card">
          <div class="input-wrapper">
            <span class="input-icon">🔗</span>
            <input
              type="text"
              id="qr-input"
              class="form-input"
              placeholder="https://example.com"
              aria-label="Enter URL to generate QR code"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div
            id="error-msg"
            class="error-msg hidden"
            role="alert"
            aria-live="polite"
          ></div>

          <!-- Options Row -->
          <div class="options-row">
            <div class="option-group">
              <label for="qr-size" class="option-label">Size</label>
              <select
                id="qr-size"
                class="form-select"
                aria-label="Select QR code size"
              >
                <option value="128">Small</option>
                <option value="256" selected>Medium</option>
                <option value="512">Large</option>
              </select>
            </div>
            <div class="option-group">
              <label for="fg-color" class="option-label">QR Color</label>
              <input
                type="color"
                id="fg-color"
                value="#ffffff"
                aria-label="Foreground color"
                class="color-picker"
              />
            </div>
            <div class="option-group">
              <label for="bg-color" class="option-label">Background</label>
              <input
                type="color"
                id="bg-color"
                value="#1a1a2e"
                aria-label="Background color"
                class="color-picker"
              />
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="btn-group">
            <button
              id="generate-btn"
              class="btn btn-primary"
              aria-label="Generate QR Code"
            >
              <span class="btn-text">Generate QR</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button id="clear-btn" class="btn btn-ghost" aria-label="Clear">
              Clear
            </button>
          </div>
        </div>

        <!-- QR Result -->
        <div
          id="qr-container"
          class="qr-container"
          aria-label="Generated QR code"
          aria-live="polite"
        ></div>

        <!-- Result Actions -->
        <div class="action-row">
          <button
            id="download-btn"
            class="btn btn-secondary hidden"
            aria-label="Download QR code as PNG"
          >
            ⬇ Download
          </button>
          <button
            id="share-btn"
            class="btn btn-secondary hidden"
            aria-label="Share QR code"
          >
            ↗ Share
          </button>
        </div>

        <!-- History -->
        <div class="history-section">
          <h2 class="history-title">Recent</h2>
          <div id="history-list" class="history-list">
            <p class="history-empty">No history yet.</p>
          </div>
        </div>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite" role="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
