        <h1 class="welcome-title">QR Generator</h1>
        <p class="welcome-subtitle">
          Ubah link jadi QR Code dalam hitungan detik

          <div class="welcome-feature-item">💾 Simpan ke Galeri</div>

          atau tunggu <span id="welcome-countdown">5</span> detik
        </p>
      </div>

    <!-- App -->
    <div id="app-wrapper" class="app-wrapper app-hidden">
      <header class="app-header">
        <div class="header-brand">
          <span class="brand-icon">🔳</span>
          <span class="brand-name">QR Generator</span>
        </div>
      </header>

      <main class="container" role="main">
        <!-- Left: Form -->
        <div class="card card-form">
          <div class="card-label">INPUT URL</div>

          <div class="form-group">
            <label for="qr-input" class="form-label">Link</label>
            <input
              type="text"
              id="qr-input"
              class="form-input"
              placeholder="https://example.com"
              aria-label="Enter URL"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div
            id="error-msg"
            class="error-msg hidden"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="form-row">
            <div class="form-group">
              <label for="qr-size" class="form-label">Ukuran</label>
              <select id="qr-size" class="form-select">
                <option value="128">Small</option>
                <option value="256" selected>Medium</option>
                <option value="512">Large</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fg-color" class="form-label">Warna QR</label>
              <input
                type="color"
                id="fg-color"
                value="#ffffff"
                class="color-picker"
              />
            </div>
            <div class="form-group">
              <label for="bg-color" class="form-label">Background</label>
              <input
                type="color"
                id="bg-color"
                value="#1a1a2e"
                class="color-picker"
              />
            </div>
          </div>

          <div class="btn-row">
            <button id="generate-btn" class="btn btn-primary">
              <span class="btn-text">&#9654; Generate QR</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button id="clear-btn" class="btn btn-ghost">Hapus</button>
          </div>
        </div>

        <!-- Right: Preview -->
        <div class="card card-preview">
          <div class="card-label">PREVIEW</div>

          <div id="qr-container" class="qr-container" aria-live="polite">
            <div class="qr-placeholder">
              <span class="qr-placeholder-icon">&#128241;</span>
              <p class="qr-placeholder-text">QR code akan muncul di sini</p>
            </div>
          </div>

          <div class="action-row">
            <button id="download-btn" class="btn btn-ghost hidden">
              &#11015; Download
            </button>
            <button id="share-btn" class="btn btn-ghost hidden">
              &#8599; Bagikan
            </button>
          </div>

          <div class="card-divider"></div>
          <p class="card-hint">Generate QR code dari link apapun</p>
        </div>
      </main>

      <!-- History -->
      <section class="history-section">
        <div class="section-header">
          <h2 class="section-title">Riwayat QR</h2>
        </div>
        <div id="history-list" class="history-list">
          <p class="history-empty">Belum ada riwayat</p>
        </div>
      </section>
    </div>

    <div id="toast" class="toast" aria-live="polite" role="status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
