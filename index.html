      </header>
      <main class="main-content">
        <!-- Generate Tab -->
        <div id="tab-generate" class="tab-panel active">
          <div class="input-card">
            <p class="input-label">Enter URL</p>
            <div class="input-wrapper">
              <span class="input-prefix">🔗</span>
              <input
                type="text"
                id="qr-input"
                class="form-input"
                placeholder="https://example.com"
                autocomplete="off"
                spellcheck="false"
                aria-label="Enter URL"
              />
            </div>
            <div
              id="error-msg"
              class="error-msg hidden"
              role="alert"
              aria-live="polite"
            ></div>
          </div>
          <div class="options-card">
            <div class="option-row">
              <div class="option-group">
                <label for="qr-size" class="option-label">Size</label>
                <select id="qr-size" class="option-select">
                  <option value="128">Small</option>
                  <option value="200" selected>Medium</option>
                  <option value="300">Large</option>
                </select>
              </div>
              <div class="option-group">
                <label for="fg-color" class="option-label">QR Color</label>
                <input
                  type="color"
                  id="fg-color"
                  value="#000000"
                  class="color-picker"
                />
              </div>
              <div class="option-group">
                <label for="bg-color" class="option-label">BG Color</label>
                <input
                  type="color"
                  id="bg-color"
                  value="#ffffff"
                  class="color-picker"
                />
              </div>
            </div>
          </div>
          <div class="preview-card">
            <div id="qr-container" class="qr-container" aria-live="polite">
              <div id="qr-placeholder" class="qr-placeholder">
                <img
                  src="assets/logo.png"
                  alt="Qraft"
                  class="qr-placeholder-logo"
                />
              </div>
            </div>
          </div>
          <div class="action-buttons">
            <button id="download-btn" class="action-btn hidden">
              <span class="action-btn-icon">⬇</span>
              <span>Download</span>
            </button>
            <button id="share-btn" class="action-btn hidden">
              <span class="action-btn-icon">↗</span>
              <span>Share</span>
            </button>
          </div>
          <div class="main-actions">
            <button id="generate-btn" class="generate-btn">
              <span class="btn-text">Generate QR</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button id="clear-btn" class="clear-btn">Clear</button>
          </div>
        </div>
        <!-- History Tab -->
        <div id="tab-history" class="tab-panel">
          <div class="history-header">
            <h2 class="history-title">Recent QR Codes</h2>
          </div>
          <div id="history-list" class="history-list">
            <div class="history-empty-state">
              <p class="history-empty">No history yet</p>
            </div>
          </div>
        </div>
        <div id="tab-scan" class="tab-panel">
          <div class="scan-header">
            <h2 class="scan-title">Scan QR Code</h2>
            <p class="scan-subtitle">Point your camera at a QR code</p>
          </div>
          <div class="scan-card">
            <div class="camera-container" id="camera-container">
              <video
                id="camera-video"
                class="camera-video"
                playsinline
                autoplay
                muted
              ></video>
              <canvas id="camera-canvas" class="camera-canvas"></canvas>
              <div class="scan-overlay">
                <div class="scan-frame">
                  <div class="scan-line"></div>
                </div>
              </div>
              <div class="camera-placeholder" id="camera-placeholder">
                <span class="camera-placeholder-icon">📷</span>
                <p class="camera-placeholder-text">Camera not active</p>
              </div>
            </div>
            <div class="scan-actions">
              <button id="start-scan-btn" class="generate-btn">
                Start Camera
              </button>
              <button id="stop-scan-btn" class="clear-btn hidden">Stop</button>
            </div>
          </div>
          <div id="scan-result" class="scan-result hidden">
            <div class="scan-result-label">Scanned Result</div>
            <p id="scan-result-text" class="scan-result-text"></p>
            <div class="scan-result-actions">
              <button id="scan-open-btn" class="action-btn">
                <span class="action-btn-icon">🔗</span>
                <span>Open URL</span>
              </button>
              <button id="scan-copy-btn" class="action-btn">
                <span class="action-btn-icon">📋</span>
                <span>Copy</span>
              </button>
            </div>
          </div>
        </div>
