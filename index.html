      <main class="container" role="main">
        <div class="card">
          <div class="card-label">QRAFT</div>

          <div class="form-group">
            <label for="qr-input" class="form-label">Link</label>
            <input
              type="text"
              id="qr-input"
              class="form-input"
              placeholder="https://example.com"
              aria-label="Enter URL"
              autocomplete="off"
              spellcheck="false"
            />
          </div>

          <div
            id="error-msg"
            class="error-msg hidden"
            role="alert"
            aria-live="polite"
          ></div>

          <div class="form-row">
            <div class="form-group">
              <label for="qr-size" class="form-label">Size</label>
              <select id="qr-size" class="form-select">
                <option value="128">Small</option>
                <option value="200" selected>Medium</option>
                <option value="300">Large</option>
              </select>
            </div>
            <div class="form-group">
              <label for="fg-color" class="form-label">QR Color</label>
              <input
                type="color"
                id="fg-color"
                value="#ffffff"
                class="color-picker"
              />
            </div>
            <div class="form-group">
              <label for="bg-color" class="form-label">Background</label>
              <input
                type="color"
                id="bg-color"
                value="#1a1a2e"
                class="color-picker"
              />
            </div>
          </div>

          <div class="btn-row">
            <button id="generate-btn" class="btn btn-primary">
              <span class="btn-text">&#9654; Generate QR</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
            <button id="clear-btn" class="btn btn-ghost">Clear</button>
          </div>

          <div class="card-divider"></div>

          <div id="qr-container" class="qr-container" aria-live="polite">
            <div id="qr-placeholder" class="qr-placeholder">
              <img
                src="assets/logo.png"
                alt="Qraft"
                class="qr-placeholder-logo"
              />
            </div>
          </div>

          <div class="action-row">
            <button id="download-btn" class="btn btn-ghost hidden">
              &#11015; Download
            </button>
            <button id="share-btn" class="btn btn-ghost hidden">
              &#8599; Share
            </button>
          </div>
        </div>
      </main>

      <!-- History -->
      <section class="history-section">
        <div class="section-header">
          <h2 class="section-title">Recent</h2>
        </div>
        <div id="history-list" class="history-list">
          <p class="history-empty">No history yet</p>
        </div>
      </section>
